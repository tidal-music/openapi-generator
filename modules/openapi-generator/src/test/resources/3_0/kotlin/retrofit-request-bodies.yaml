        '204':
          description: Success
    post:
      operationId: postWithBody
      requestBody:
        $ref: '#/components/requestBodies/Payload'
      responses:
        '204':
          description: Success
    put:
      operationId: putWithBody
      requestBody:
        $ref: '#/components/requestBodies/Payload'
